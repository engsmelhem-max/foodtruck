<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متجر النيون التفاعلي 🎮</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0c29;
            --shelf-color: #302b63;
            --neon-pink: #ff00de;
            --neon-cyan: #00e5ff;
            --neon-green: #39ff14;
            --text-light: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html { scroll-behavior: smooth; } /* التمرير الناعم */

        body {
            background: linear-gradient(to bottom, var(--bg-color), #24243e);
            color: var(--text-light);
            min-height: 100vh;
            padding-bottom: 120px;
            overflow-x: hidden;
        }

        /* --- Start Screen (Arcade Style) --- */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 99999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s, visibility 0.5s; cursor: pointer;
        }
        #start-screen.hidden { opacity: 0; visibility: hidden; }
        .start-text {
            font-size: 3rem; font-weight: 900; color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
            animation: pulse-start 1s infinite alternate; margin-bottom: 20px;
        }
        .start-sub { color: var(--neon-pink); font-size: 1.2rem; text-shadow: 0 0 10px var(--neon-pink); }
        @keyframes pulse-start {
            from { opacity: 0.5; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1.05); }
        }

        /* --- Header & Quick Navigation --- */
        header {
            text-align: center; padding: 20px;
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink);
            font-size: 1.5rem; font-weight: 900; letter-spacing: 2px;
            border-bottom: 2px solid var(--neon-cyan); box-shadow: 0 0 15px var(--neon-cyan);
            background: rgba(0, 0, 0, 0.5);
        }

        .quick-nav {
            display: flex; justify-content: space-evenly; align-items: center;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 1000;
            padding: 10px 5px; border-bottom: 1px solid var(--neon-pink);
            box-shadow: 0 5px 15px rgba(255, 0, 222, 0.2); margin-bottom: 20px;
            overflow-x: auto; scrollbar-width: none;
        }
        .quick-nav::-webkit-scrollbar { display: none; }
        .nav-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--neon-cyan);
            border-radius: 50%; width: 45px; height: 45px; font-size: 1.5rem;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: 0.3s; flex-shrink: 0; box-shadow: 0 0 10px rgba(0,229,255,0.2);
        }
        .nav-btn:active, .nav-btn:hover { background: var(--neon-cyan); box-shadow: 0 0 20px var(--neon-cyan); }

        /* --- Store Elements --- */
        .instruction { text-align: center; font-size: 0.9rem; color: #aaa; margin-bottom: 15px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; color: var(--neon-cyan); } 100% { opacity: 0.6; } }

        .store-container { display: flex; flex-direction: column; gap: 40px; padding: 0 10px; scroll-margin-top: 100px; }

        .shelf-section {
            background: rgba(48, 43, 99, 0.3); border-radius: 15px;
            border: 1px solid var(--neon-cyan); box-shadow: inset 0 0 10px var(--neon-cyan);
            padding: 15px 0; position: relative; scroll-margin-top: 80px; /* المسافة من الأعلى عند الضغط على زر التنقل */
        }

        .shelf-title {
            position: absolute; top: -15px; right: 20px; background: var(--bg-color);
            padding: 0 15px; color: var(--neon-cyan); font-weight: bold;
            border: 1px solid var(--neon-cyan); border-radius: 20px; box-shadow: 0 0 8px var(--neon-cyan); z-index: 2;
        }

        .shelf {
            display: flex; overflow-x: auto; gap: 15px; padding: 20px 15px 10px 15px;
            scroll-snap-type: x mandatory; scrollbar-width: thin; scrollbar-color: var(--neon-pink) transparent;
        }
        .shelf::-webkit-scrollbar { height: 6px; }
        .shelf::-webkit-scrollbar-thumb { background-color: var(--neon-pink); border-radius: 10px; }

        /* --- Products --- */
        .product {
            flex: 0 0 120px; scroll-snap-align: center; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; padding: 10px;
            text-align: center; cursor: grab; transition: transform 0.2s, box-shadow 0.2s;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            height: 140px; user-select: none; touch-action: pan-x;
        }
        .product:active { cursor: grabbing; transform: scale(1.05); }
        .product-icon { font-size: 3rem; margin-bottom: 5px; filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); }
        .product-name { font-size: 0.85rem; font-weight: bold; line-height: 1.2; margin-bottom: 5px; }
        .product-price { color: var(--neon-green); font-weight: 900; font-size: 0.9rem; text-shadow: 0 0 5px var(--neon-green); }

        /* --- Basket --- */
        .cart-basket {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; background: rgba(15, 12, 41, 0.9);
            border: 2px solid var(--neon-pink); border-radius: 30px; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 0 20px var(--neon-pink); z-index: 1000; cursor: pointer;
            backdrop-filter: blur(5px); transition: transform 0.1s;
        }
        .cart-basket.bounce { transform: translateX(-50%) scale(1.1); }
        .cart-basket.drag-over { background: rgba(255, 0, 222, 0.3); box-shadow: 0 0 40px var(--neon-pink); }
        .cart-title { font-size: 1.2rem; font-weight: bold; }
        .cart-total { color: var(--neon-green); font-weight: 900; font-size: 1.1rem; }
        .basket-icon { font-size: 2.5rem; position: relative; }
        .cart-badge {
            position: absolute; top: -5px; right: -5px; background: var(--neon-cyan); color: #000;
            font-weight: bold; border-radius: 50%; width: 25px; height: 25px;
            display: flex; align-items: center; justify-content: center; font-size: 0.9rem;
        }

        /* --- Modals & Forms --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); z-index: 2000; display: none;
            justify-content: center; align-items: flex-end; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #1a1a2e; width: 100%; max-height: 85vh;
            border-top-left-radius: 30px; border-top-right-radius: 30px; border-top: 3px solid var(--neon-cyan);
            padding: 20px; display: flex; flex-direction: column; box-shadow: 0 -10px 30px rgba(0, 229, 255, 0.2);
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .close-btn { background: none; border: none; color: var(--neon-pink); font-size: 2rem; cursor: pointer; }
        
        .cart-items-list { overflow-y: auto; flex: 1; margin-bottom: 20px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); margin-bottom: 10px; padding: 10px; border-radius: 10px; border-right: 3px solid var(--neon-pink); }
        .item-details { display: flex; align-items: center; gap: 10px; flex: 1; }
        .qty-controls { display: flex; align-items: center; gap: 10px; background: rgba(0, 0, 0, 0.3); padding: 5px 10px; border-radius: 20px; border: 1px solid var(--neon-cyan); }
        .qty-btn { background: none; border: none; color: var(--neon-cyan); font-size: 1.5rem; font-weight: bold; cursor: pointer; padding: 0 5px; }
        .qty-number { font-weight: bold; font-size: 1.1rem; width: 20px; text-align: center; }

        .checkout-form { display: flex; flex-direction: column; gap: 15px; overflow-y: auto;}
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { color: var(--neon-cyan); font-weight: bold; font-size: 0.9rem; }
        .neon-input { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 12px; border-radius: 10px; font-size: 1rem; outline: none; transition: 0.3s; }
        .neon-input:focus { border-color: var(--neon-pink); box-shadow: 0 0 10px rgba(255, 0, 222, 0.5); }
        .neon-input option { background: var(--bg-color); color: white; }
        .primary-btn { background: linear-gradient(45deg, var(--neon-pink), var(--neon-cyan)); border: none; padding: 15px; border-radius: 15px; color: white; font-size: 1.2rem; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px rgba(255, 0, 222, 0.4); margin-top: 10px; }

        .drag-clone { position: fixed; pointer-events: none; z-index: 9999; transform: scale(1.1); opacity: 0.9; box-shadow: 0 0 20px var(--neon-cyan); }

    </style>
</head>
<body>

    <!-- 🎮 شاشة البداية 🎮 -->
    <div id="start-screen" onclick="startGame()">
        <div class="start-text">اضغط للبدء</div>
        <div class="start-sub">🛒 جهّز سلتك 🛒</div>
    </div>

    <header>⚡ متجر سترايك ⚡</header>

    <!-- 🚀 شريط التنقل السريع 🚀 -->
    <nav class="quick-nav" id="quick-nav">

    </nav>

    <!-- سلة المشتريات -->
    <div class="cart-basket" id="cart-basket" onclick="openCartModal()">
        <div class="cart-info">
            <span class="cart-title">سلة المشتريات</span>
            <span class="cart-total" id="cart-total-display">0 قرش</span>

        <div class="basket-icon">🛒<div class="cart-badge" id="cart-badge">0</div></div>

    <!-- نافذة المراجعة -->
    <div class="modal-overlay" id="cart-modal-overlay" onclick="closeModalOnBG(event, 'cart-modal-overlay')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2>مراجعة السلة 🛒</h2>

            </div>

        </div>
    </div>

    <!-- نافذة الدفع -->
    <div class="modal-overlay" id="checkout-modal-overlay" onclick="closeModalOnBG(event, 'checkout-modal-overlay')">

                </div>
                <div class="form-group">
                    <label>رقم الهاتف (يجب أن يبدأ بـ 07)</label>
                    <input type="tel" id="cust-phone" class="neon-input" required pattern="^07[0-9]{8}$" maxlength="10" placeholder="مثال: 0791234567" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                </div>
                <div class="form-group">

                        <option value="البريد الاردني">البريد الأردني</option>
                        <option value="مكتب الخدمات الحكومية">مكتب الخدمات الحكومية</option>
                        <option value="نادي الشباب العربي">نادي الشباب العربي</option>
                    </select>
                </div>
                <button type="submit" class="primary-btn">تأكيد الطلب النهائي ✅</button>
            </form>

    <script>
        // 🎵 --- محرك الأصوات (Web Audio API) 8-Bit --- 🎵
        // توليد الأصوات برمجياً بدون الحاجة لملفات خارجية
        let audioCtx;
        function initAudio() {
            if(!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if(audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            if (type === 'start') {
                // صوت بدأ اللعبة
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'pop') {
                // صوت مسك المنتج للسحب
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'coin') {
                // صوت إفلات المنتج بالسلة (مثل صوت جمع النقد باللعبة)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, now); // B5
                osc.frequency.setValueAtTime(1318.51, now + 0.1); // E6
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'success') {
                // صوت نجاح الطلب
                osc.type = 'square';
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    osc.frequency.setValueAtTime(freq, now + i*0.1);
                });
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            }
        }

        // إخفاء شاشة البداية وبدء المحرك الصوتي

            { category: "شيبس", icon: "🍟", items: [{ id: 50, name: "تشيزرز", price: 15, img: "🧀" }, { id: 51, name: "تشيزي", price: 15, img: "🧀" }, { id: 52, name: "بوشار", price: 15, img: "🍿" }, { id: 53, name: "زوم اخضر", price: 15, img: "🍟" }, { id: 54, name: "زوم احمر", price: 15, img: "🍟" }, { id: 55, name: "بينغ رينغ", price: 15, img: "🧅" }, { id: 56, name: "هلا بطاطا", price: 15, img: "🥔" }, { id: 57, name: "كتكو نايس بطاطا", price: 15, img: "🥔" }, { id: 58, name: "ريلاكس", price: 15, img: "🍟" }, { id: 59, name: "بفاك فول سوداني", price: 15, img: "🥜" }, { id: 60, name: "جولدي", price: 15, img: "🍟" }, { id: 61, name: "بوكس وسط", price: 40, img: "📦" }, { id: 62, name: "سناك مكس وسط", price: 60, img: "🥨" }, { id: 63, name: "بوشار وسط", price: 50, img: "🍿" }] },
            { category: "تسالي", icon: "🥜", items: [{ id: 64, name: "بزر عين شمس", price: 100, img: "🌻" }, { id: 65, name: "بزر ابيض", price: 100, img: "🎃" }, { id: 66, name: "بزر اسود افغاني", price: 100, img: "🍉" }, { id: 67, name: "بزر شمام", price: 100, img: "🍈" }, { id: 68, name: "تسالي ماليزية صغير", price: 75, img: "🥜" }, { id: 69, name: "تسالي ماليزية كبير", price: 125, img: "🥜" }, { id: 70, name: "ايس فستق حار عائلي", price: 75, img: "🌶️" }, { id: 71, name: "بوشار طازج", price: 50, img: "🍿" }, { id: 72, name: "ذرة علبة صغير", price: 50, img: "🌽" }, { id: 73, name: "ذرة علبة كبير", price: 75, img: "🌽" }] },
            { category: "البوظة", icon: "🍦", items: [{ id: 74, name: "كف احمر", price: 10, img: "🖐️" }, { id: 75, name: "ساندوش صغير", price: 15, img: "🍦" }, { id: 76, name: "ساندوش كبير", price: 25, img: "🍦" }, { id: 77, name: "قرطوس صغير", price: 50, img: "🍦" }, { id: 78, name: "قرطوس كبير", price: 75, img: "🍦" }, { id: 79, name: "علب صغير", price: 15, img: "🍨" }, { id: 80, name: "علب كبير", price: 50, img: "🍨" }, { id: 81, name: "بيانو", price: 20, img: "🎹" }, { id: 82, name: "لولي", price: 15, img: "🍭" }, { id: 83, name: "كاسة ثلج", price: 35, img: "🍧" }, { id: 84, name: "ميمو", price: 15, img: "🍦" }] }
        ];

        // بناء الواجهة (الرفوف وشريط التنقل)
        const storeContainer = document.getElementById('store-container');
        const quickNav = document.getElementById('quick-nav');

        storeData.forEach((section, index) => {
            const sectionId = `shelf-sec-${index}`;
            
            // 1. إضافة الزر لشريط التنقل
            const navBtn = document.createElement('div');
            navBtn.className = 'nav-btn';
            navBtn.innerText = section.icon;
            navBtn.onclick = () => document.getElementById(sectionId).scrollIntoView({ behavior: 'smooth' });
            quickNav.appendChild(navBtn);

            // 2. بناء الرف
            const sectionDiv = document.createElement('div');
            sectionDiv.className = 'shelf-section';
            sectionDiv.id = sectionId;
            sectionDiv.innerHTML = `<div class="shelf-title">${section.icon} ${section.category}</div>`;
            
            const shelf = document.createElement('div');
            shelf.className = 'shelf';
            
            section.items.forEach(item => {
                const product = document.createElement('div');
                product.className = 'product';
                product.dataset.id = item.id; product.dataset.name = item.name;
                product.dataset.price = item.price; product.dataset.img = item.img;
                product.innerHTML = `<div class="product-icon">${item.img}</div><div class="product-name">${item.name}</div><div class="product-price">${item.price} قرش</div>`;
                shelf.appendChild(product);
            });
            sectionDiv.appendChild(shelf);
            storeContainer.appendChild(sectionDiv);
        });

        // --- نظام السلة ---
        let cart = [];
        function formatCurrency(q) {
            if (q >= 100) return `${Math.floor(q/100)} دينار ${q%100 === 0 ? '' : 'و '+ (q%100) +' قرش'}`;
            return `${q} قرش`;
        }

        function updateCartUI() {
            const totalQirsh = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const totalItemsCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            
            const formattedTotal = formatCurrency(totalQirsh);
            document.getElementById('cart-total-display').innerText = formattedTotal;
            document.getElementById('modal-total').innerText = formattedTotal;
            document.getElementById('cart-badge').innerText = totalItemsCount;

            const cartList = document.getElementById('cart-items-list');
            cartList.innerHTML = '';
            if (cart.length === 0) {
                cartList.innerHTML = '<p style="text-align:center; color:#888; margin-top:20px;">السلة فارغة حالياً</p>';
            } else {
                cart.forEach((item) => {
                    cartList.innerHTML += `
                        <div class="cart-item">
                            <div class="item-details"><span style="font-size:1.5rem;">${item.img}</span> 
                            <div><div style="font-weight:bold;">${item.name}</div><div style="color:var(--neon-green); font-size:0.9rem;">${item.price} قرش للحبة</div></div></div>
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                                <span class="qty-number">${item.quantity}</span>
                                <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                            </div>
                        </div>`;
                });
            }
        }

        function addToCart(draggedItem) {
            let existingItem = cart.find(i => i.id == draggedItem.id);
            if (existingItem) existingItem.quantity += 1;
            else cart.push({ ...draggedItem, quantity: 1 });
            
            updateCartUI();
            
            playSound('coin'); // 🎵 تشغيل صوت الإفلات
            const basket = document.getElementById('cart-basket');
            basket.classList.add('bounce');
            setTimeout(() => basket.classList.remove('bounce'), 200);
            if (navigator.vibrate) navigator.vibrate(50);
        }

        window.changeQty = function(id, change) {
            let itemIndex = cart.findIndex(i => i.id == id);
            if (itemIndex > -1) {
                cart[itemIndex].quantity += change;
                if (cart[itemIndex].quantity <= 0) cart.splice(itemIndex, 1);
                updateCartUI();
            }
        };

        // --- النوافذ المنبثقة ---
        window.openCartModal = () => document.getElementById('cart-modal-overlay').style.display = 'flex';
        window.closeCartModal = () => document.getElementById('cart-modal-overlay').style.display = 'none';
        
        window.proceedToCheckout = function() {
            if(cart.length === 0) return alert("السلة فارغة!");
            closeCartModal();
            document.getElementById('checkout-modal-overlay').style.display = 'flex';
            if(localStorage.getItem('st_name')) document.getElementById('cust-name').value = localStorage.getItem('st_name');
            if(localStorage.getItem('st_phone')) document.getElementById('cust-phone').value = localStorage.getItem('st_phone');
            if(localStorage.getItem('st_loc')) document.getElementById('cust-location').value = localStorage.getItem('st_loc');
        };
        
        window.closeCheckoutModal = () => document.getElementById('checkout-modal-overlay').style.display = 'none';
        window.closeModalOnBG = (e, id) => { if (e.target.id === id) document.getElementById(id).style.display = 'none'; };

        window.submitOrder = function(e) {
            e.preventDefault();
            const phone = document.getElementById('cust-phone').value;
            if (!/^07\d{8}$/.test(phone)) return alert("يرجى التأكد من أن رقم الهاتف يتكون من 10 أرقام ويبدأ بـ 07");

            localStorage.setItem('st_name', document.getElementById('cust-name').value);
            localStorage.setItem('st_phone', phone);
            localStorage.setItem('st_loc', document.getElementById('cust-location').value);

            playSound('success'); // 🎵 تشغيل صوت النجاح

            const total = formatCurrency(cart.reduce((s, i) => s + (i.price * i.quantity), 0));
            alert(`🎉 تم تأكيد طلبك بنجاح!\nالمبلغ: ${total}`);
            
            cart = []; updateCartUI(); closeCheckoutModal();
        };

        // --- نظام السحب والإفلات للهواتف ---
        let isDragging = false, dragClone = null, dragItemData = null, pressTimer = null;
        const basketEl = document.getElementById('cart-basket');
        document.querySelectorAll('.product').forEach(p => {
            p.addEventListener('touchstart', handleDragStart, {passive: false});
            p.addEventListener('mousedown', handleDragStart);
        });

        document.addEventListener('touchmove', handleDragMove, {passive: false});
        document.addEventListener('mousemove', handleDragMove);
        document.addEventListener('touchend', handleDragEnd);
        document.addEventListener('mouseup', handleDragEnd);

        function handleDragStart(e) {
            if (e.type === 'touchstart') pressTimer = setTimeout(() => initiateDrag(e, this), 200);
            else { initiateDrag(e, this); e.preventDefault(); }
        }

        function initiateDrag(e, el) {
            isDragging = true;
            dragItemData = { id: el.dataset.id, name: el.dataset.name, price: parseInt(el.dataset.price), img: el.dataset.img };
            dragClone = el.cloneNode(true); dragClone.classList.add('drag-clone');
            document.body.appendChild(dragClone);
            
            playSound('pop'); // 🎵 تشغيل صوت المسك

            if (navigator.vibrate) navigator.vibrate(20);
            positionClone(e);
        }

        function handleDragMove(e) {
            if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
            if (!isDragging || !dragClone) return;
            if (e.cancelable) e.preventDefault(); 
            positionClone(e);
            isOverBasket(e) ? basketEl.classList.add('drag-over') : basketEl.classList.remove('drag-over');
        }

        function positionClone(e) {
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            dragClone.style.left = (cx - dragClone.offsetWidth / 2) + 'px';
            dragClone.style.top = (cy - dragClone.offsetHeight / 2) + 'px';
        }

        function handleDragEnd(e) {
            if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
            if (!isDragging) return;
            isDragging = false; basketEl.classList.remove('drag-over');
            if (isOverBasket(e)) {
                addToCart(dragItemData);
                dragClone.style.transform = 'scale(0.1)'; dragClone.style.opacity = '0';
                setTimeout(() => dragClone.remove(), 200);
            } else dragClone.remove();
            dragClone = null; dragItemData = null;
        }

        function isOverBasket(e) {
            const cx = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
            const cy = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
            const r = basketEl.getBoundingClientRect();
            return (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom);
        }
    </script>
</body>
</html>
